<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>משחקים חינמיים</title>
<style>
  :root {
    --bg: #0f1220;
    --card: #1a1f35;
    --card-hover: #232a47;
    --text: #f2f4ff;
    --muted: #9aa3c7;
    --accent: #ffb020;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", Arial, sans-serif;
    background: radial-gradient(1200px 600px at 70% -10%, #26305c 0%, var(--bg) 60%);
    color: var(--text);
    min-height: 100vh;
  }
  header {
    text-align: center;
    padding: 48px 16px 24px;
  }
  header h1 { font-size: 2.4rem; letter-spacing: 1px; }
  header h1 span { color: var(--accent); }
  header p { color: var(--muted); margin-top: 8px; }
  main {
    max-width: 1000px;
    margin: 0 auto;
    padding: 24px 16px 64px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 20px;
  }
  .card {
    display: block;
    background: var(--card);
    border: 1px solid #2a3156;
    border-radius: 16px;
    padding: 20px;
    text-decoration: none;
    color: var(--text);
    transition: transform .15s ease, background .15s ease;
  }
  .card:hover { background: var(--card-hover); transform: translateY(-4px); }
  .thumb {
    width: 100%;
    aspect-ratio: 16 / 10;
    border-radius: 12px;
    background: linear-gradient(135deg, #3a7bd5, #00c9a0);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 3rem;
    margin-bottom: 14px;
  }
  .card h2 { font-size: 1.2rem; margin-bottom: 6px; }
  .card p { color: var(--muted); font-size: .9rem; line-height: 1.5; }
  .badge {
    display: inline-block;
    margin-top: 10px;
    background: var(--accent);
    color: #20180a;
    font-size: .75rem;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 999px;
  }
  footer {
    text-align: center;
    color: var(--muted);
    font-size: .8rem;
    padding: 24px;
  }
</style>
</head>
<body>
<header>
  <h1>🎮 משחקים <span>חינמיים</span></h1>
  <p>משחקי דפדפן קטנים וכיפיים - בלי הורדות, בלי הרשמה</p>
</header>
<main>
  <div class="grid">
    <a class="card" href="stickman-hook/">
      <div class="thumb">🕸️</div>
      <h2>סטיקמן הוק</h2>
      <p>תנדנדו עם וו בין נקודות עיגון, צברו תאוצה והגיעו לקו הסיום. מבוסס פיזיקה, עם שלבים ומצב מובייל.</p>
      <span class="badge">שחקו עכשיו</span>
    </a>
    <!-- משחקים חדשים יתווספו כאן -->
  </div>
</main>
<footer>נבנה באהבה · כל המשחקים קוד מקורי וחינמיים</footer>
</body>
</html>
