<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>סטיקמן הוק - משחקים</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; font-family: 'Heebo', sans-serif; background: #7b5cff; }
  #game { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; touch-action: none; }

  .overlay { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column; z-index: 10; }
  .overlay.show { display: flex; }

  /* ---- menu: teal gradient like the original's menu identity ---- */
  #menu { background: linear-gradient(180deg, #3fd0c9 0%, #7ee6c8 100%); }
  .logo { font-size: clamp(44px, 9vw, 88px); font-weight: 900; color: #fff; letter-spacing: 1px;
    text-shadow: 0 6px 0 rgba(0,0,0,.14); margin-bottom: 6px; }
  .logo .red { color: #ff4d5e; text-shadow: 0 6px 0 rgba(0,0,0,.16); }
  .menu-sub { color: rgba(255,255,255,.92); font-size: 19px; font-weight: 700; margin-bottom: 42px; }

  .bigbtn { border: none; cursor: pointer; font-family: inherit; font-weight: 900; color: #fff;
    background: linear-gradient(180deg, #ff7a5c, #ff4d5e); border-radius: 999px;
    padding: 18px 58px; font-size: 26px; box-shadow: 0 8px 0 #d8314f, 0 14px 26px rgba(0,0,0,.22);
    transition: transform .12s, box-shadow .12s; }
  .bigbtn:hover { transform: translateY(-2px) scale(1.03); }
  .bigbtn:active { transform: translateY(4px); box-shadow: 0 3px 0 #d8314f, 0 8px 14px rgba(0,0,0,.2); }
  .bigbtn.small { padding: 13px 40px; font-size: 21px; }
  #menu-level { margin-top: 20px; color: rgba(255,255,255,.85); font-weight: 700; font-size: 16px; }

  /* ---- intro: violet ---- */
  #intro { background: linear-gradient(180deg, #6a4de0 0%, #8f7bff 100%); }
  .intro-level { font-size: clamp(38px, 7vw, 64px); font-weight: 900; color: #fff; text-shadow: 0 5px 0 rgba(0,0,0,.16); }
  .intro-name { color: rgba(255,255,255,.85); font-size: 21px; font-weight: 700; margin: 8px 0 4px; }
  .intro-hint { color: rgba(255,255,255,.75); font-size: 16px; margin-bottom: 40px; min-height: 22px; }
  .playbtn { width: 118px; height: 118px; border-radius: 50%; border: none; cursor: pointer;
    background: linear-gradient(180deg, #ff7a5c, #ff4d5e); box-shadow: 0 9px 0 #d8314f, 0 16px 30px rgba(0,0,0,.25);
    display: flex; align-items: center; justify-content: center; transition: transform .12s, box-shadow .12s; }
  .playbtn:hover { transform: scale(1.06); }
  .playbtn:active { transform: translateY(5px); box-shadow: 0 3px 0 #d8314f; }
  .playbtn svg { width: 46px; height: 46px; fill: #fff; margin-right: -8px; }

  /* ---- cleared card ---- */
  #clear { background: rgba(46, 33, 101, .88); }
  .card { position: relative; background: #fff; border-radius: 26px; padding: 54px 48px 42px; text-align: center;
    box-shadow: 0 24px 60px rgba(0,0,0,.35); overflow: hidden; max-width: 88vw; }
  .card::before { content: ''; position: absolute; inset: -60%; z-index: 0;
    background: repeating-conic-gradient(rgba(87,223,196,.22) 0 14deg, rgba(87,223,196,0) 14deg 28deg);
    animation: spin 14s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .card > * { position: relative; z-index: 1; }
  .clear-title { font-size: 34px; font-weight: 900; color: #4a3ba8; margin-bottom: 18px; }
  .pct-wrap { background: #ece9fb; border-radius: 999px; height: 26px; width: 260px; max-width: 62vw; margin: 0 auto 8px; overflow: hidden; }
  .pct-fill { height: 100%; width: 0; border-radius: 999px; background: linear-gradient(90deg, #57dfc4, #3fd0c9);
    transition: width 1s cubic-bezier(.2,.8,.25,1); }
  .pct-label { color: #8a80c0; font-weight: 700; font-size: 15px; margin-bottom: 30px; }

  /* ---- pause + corner buttons ---- */
  #paused { background: rgba(46, 33, 101, .72); }
  .paused-title { color: #fff; font-size: 36px; font-weight: 900; margin-bottom: 26px; }
  .iconbtn { position: fixed; z-index: 20; width: 52px; height: 52px; border-radius: 14px; border: none; cursor: pointer;
    background: rgba(36,31,58,.38); color: #fff; font-size: 22px; display: none; align-items: center; justify-content: center;
    backdrop-filter: blur(2px); }
  #btn-pause { top: 14px; left: 14px; }
  #btn-mute { top: 14px; left: 76px; display: flex !important; }
  .row { display: flex; gap: 14px; }

  /* ---- win flash ---- */
  #winflash { position: fixed; inset: 0; z-index: 15; pointer-events: none; opacity: 0;
    background: radial-gradient(ellipse at center, rgba(255,255,255,.85) 0%, rgba(255,255,255,0) 70%); }
  #winflash.show { animation: flash .6s ease-out; }

  /* ---- skins ---- */
  #skins { display: flex; gap: 12px; margin-top: 26px; align-items: center; }
  .skin-dot { width: 34px; height: 34px; border-radius: 50%; border: 3px solid rgba(255,255,255,.55); cursor: pointer;
    display: flex; align-items: center; justify-content: center; font-size: 13px; color: #fff; transition: transform .12s; }
  .skin-dot.sel { border-color: #fff; transform: scale(1.18); box-shadow: 0 0 0 4px rgba(255,255,255,.25); }
  .skin-dot.locked { opacity: .45; cursor: default; }
  #menu-buttons { display: flex; gap: 14px; align-items: center; }

  /* ---- level select ---- */
  #levelsel { background: linear-gradient(180deg, #6a4de0 0%, #8f7bff 100%); z-index: 30; }
  .levelsel-title { color: #fff; font-size: 34px; font-weight: 900; margin-bottom: 22px; text-shadow: 0 4px 0 rgba(0,0,0,.16); }
  #level-grid { display: grid; grid-template-columns: repeat(6, 58px); gap: 12px; max-width: 92vw; margin-bottom: 26px; }
  .lv-btn { width: 58px; height: 58px; border-radius: 16px; border: none; cursor: pointer; font-family: inherit;
    font-weight: 900; font-size: 20px; background: #fff; color: #4a3ba8; box-shadow: 0 5px 0 rgba(36,31,58,.35);
    transition: transform .1s; position: relative; }
  .lv-btn:hover { transform: scale(1.07); }
  .lv-btn.done { background: #57dfc4; color: #14524a; }
  .lv-btn.current { background: #ffb020; color: #5c3a00; }
  .lv-btn.locked { background: rgba(255,255,255,.22); color: rgba(255,255,255,.65); cursor: default; box-shadow: none; font-size: 17px; }
  .lv-btn.locked:hover { transform: none; }
  @media (max-width: 600px) { #level-grid { grid-template-columns: repeat(5, 52px); gap: 9px; } .lv-btn { width: 52px; height: 52px; } }

  /* ---- intro prev/next ---- */
  .intro-nav { display: flex; align-items: center; gap: 34px; }
  .navbtn { width: 56px; height: 56px; border-radius: 50%; border: none; cursor: pointer; font-size: 26px; font-weight: 900;
    background: rgba(255,255,255,.22); color: #fff; display: flex; align-items: center; justify-content: center; transition: transform .1s; }
  .navbtn:hover { transform: scale(1.1); background: rgba(255,255,255,.34); }
  .navbtn:disabled { opacity: .3; cursor: default; transform: none; }
  #clear-time { color: #8a80c0; font-weight: 700; font-size: 15px; margin: -18px 0 24px; }

  /* ---- fail flash ---- */
  #failflash { position: fixed; inset: 0; z-index: 15; pointer-events: none; opacity: 0;
    background: radial-gradient(ellipse at center, rgba(255,60,80,0) 40%, rgba(255,60,80,.55) 100%); }
  #failflash.show { animation: flash .55s ease-out; }
  @keyframes flash { 0% { opacity: 0; } 25% { opacity: 1; } 100% { opacity: 0; } }

  @media (max-width: 600px) {
    .bigbtn { padding: 15px 44px; font-size: 22px; }
    .playbtn { width: 100px; height: 100px; }
    .card { padding: 42px 28px 32px; }
  }
</style>
</head>
<body>
<canvas id="game"></canvas>

<button class="iconbtn" id="btn-pause" aria-label="השהיה">⏸</button>
<button class="iconbtn" id="btn-mute" aria-label="צליל">🔊</button>

<div class="overlay show" id="menu">
  <div class="logo">סטיקמן <span class="red">הוק</span></div>
  <div class="menu-sub">תפסו. נדנדו. עפו.</div>
  <div id="menu-buttons">
    <button class="bigbtn" id="btn-play">שחקו</button>
  </div>
  <button class="bigbtn small" id="btn-levels" style="margin-top:18px">בחירת שלב</button>
  <div id="skins"></div>
  <div id="menu-level">שלב 1 / 30</div>
</div>

<div class="overlay" id="levelsel">
  <div class="levelsel-title">בחירת שלב</div>
  <div id="level-grid"></div>
  <button class="bigbtn small" id="btn-levels-close">סגירה</button>
</div>

<div class="overlay" id="intro">
  <div class="intro-level" id="intro-level">שלב 1 / 8</div>
  <div class="intro-name" id="intro-name"></div>
  <div class="intro-hint" id="intro-hint"></div>
  <div class="intro-nav">
    <button class="navbtn" id="btn-prev-lv" aria-label="שלב קודם">›</button>
    <button class="playbtn" id="btn-go" aria-label="התחלה">
      <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    </button>
    <button class="navbtn" id="btn-next-lv" aria-label="שלב הבא">‹</button>
  </div>
</div>

<div class="overlay" id="clear">
  <div class="card">
    <div class="clear-title" id="clear-title">השלב הושלם!</div>
    <div class="pct-wrap"><div class="pct-fill" id="clear-fill"></div></div>
    <div class="pct-label" id="clear-pct">0%</div>
    <div id="clear-time"></div>
    <button class="bigbtn small" id="btn-next">השלב הבא</button>
  </div>
</div>

<div class="overlay" id="paused">
  <div class="paused-title">השהיה</div>
  <div class="row">
    <button class="bigbtn small" id="btn-resume">המשך</button>
    <button class="bigbtn small" id="btn-restart">התחל מחדש</button>
    <button class="bigbtn small" id="btn-pause-levels">בחירת שלב</button>
  </div>
</div>

<div id="failflash"></div>
<div id="winflash"></div>

<script src="physics.js"></script>
<script src="visuals.js"></script>
<script src="levels.js"></script>
<script src="game.js"></script>
</body>
</html>
